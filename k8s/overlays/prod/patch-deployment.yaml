apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: fintech
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fintech-app
  template:
    metadata:
      labels:
        app: fintech-app
    spec:
      containers:
        - name: fintech-app
          image: 897729103769.dkr.ecr.us-east-2.amazonaws.com/fintech-app:1.0.0